version: 2

models:
  - name: fact_events
    description: "Tabla de hechos de eventos - capa curada para analitica"
    columns:
      - name: event_id
        description: "ID unico del evento"
        tests:
          - unique
          - not_null
      - name: date_id
        description: "Fecha del evento en formato YYYYMMDD"
        tests:
          - not_null
      - name: customer_id
        description: "ID del cliente"
      - name: product_id
        description: "ID del producto"
      - name: session_id
        description: "ID de sesion"
      - name: event_type
        description: "Tipo de evento"
        tests:
          - not_null
          - accepted_values:
              values: ['login', 'view', 'add_to_cart', 'checkout', 'purchase', 'cart_abandoned']
      - name: ingestion_time
        description: "Timestamp de ingesta"
        tests:
          - not_null
      - name: transformed_at
        description: "Timestamp de transformacion dbt"
        tests:
          - not_null
